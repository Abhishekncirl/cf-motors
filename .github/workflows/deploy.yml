name: Deploy to GitHub Pages

# Deploys the CF Motor Sales site to GitHub Pages (project site at
# https://<user>.github.io/cf-motors/). Firebase is optional here: with no
# secrets set, the site builds and runs in "UI-only" mode (stock/admin show a
# "not configured" notice). Add the VITE_FIREBASE_* repo secrets later to wire
# up the live backend - no workflow change needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Auto-enables Pages (build type = GitHub Actions) on the first run, so no
      # manual toggle in repo Settings is required.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Base path for a project Pages site served under /cf-motors/.
          # (For a custom domain at the root, set this to '/'.)
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/cf-motors/' }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url || 'https://abhishekncirl.github.io/cf-motors' }}
          # Firebase config (optional - leave unset for a UI-only preview).
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: SPA fallback + Pages files
        run: |
          # Serve the SPA for any deep link: a copy of index.html as 404.html is
          # the most robust fallback for project Pages sub-paths.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
